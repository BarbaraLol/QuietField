<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>QuietField</title>
</head>
<body>

<script>
  const lang = (navigator.language || "en").toLowerCase();

  if (lang.startsWith("it")) {
    location.href = "./it/";
  } 
  else if (lang.startsWith("fr")) {
    location.href = "./fr/";
  } 
  else {
    location.href = "./en/";
  }
</script>

</body>
</html>
