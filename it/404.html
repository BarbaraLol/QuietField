<body class="bg-background text-on-background selection:bg-digital-lime/30 overflow-x-hidden flex flex-col min-h-screen">

      <div id="tilt-card" class="relative glass-card p-12 rounded-3xl shadow-2xl flex flex-col items-center">
        <div class="w-32 h-32 mb-6 rounded-full bg-surface-container flex items-center justify-center">
          <span class="material-symbols-outlined icon-light text-6xl text-outline-variant">sensors_off</span>
        </div>
        <div class="absolute -top-4 -right-4 bg-error text-on-error px-4 py-1 rounded-full font-data-mono text-data-mono">
          ERR_NOT_FOUND
        </div>
      </div>

      <!-- Decorative background image -->
      <div class="absolute -z-10 w-full h-full opacity-20 grayscale">
        <div class="w-full h-full bg-cover bg-center rounded-[4rem]" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC_y33CUZKLWwYZAEW-kUT-erT4aVZ3TC-fN7q_OwEE2CW4fP29Y2ZhkkNIw-BgF-PPp0avRzlQ8pe5RHDhp5ksy7qkaS7WN3pBRAFhoAmK4sHOhAtmw0t2QlUSYfJS_F7nCVmvt9oj_atd-xgJRYTLg1_nW035FguPSagERMEYHauQz7KIM3TaZXMeSoQh4v-R2WBIEGqy-TCbTu1e08bivTvm8EHdTx0AsmMLlviIBWs6XTIOvBwLnCQRbIcj2IqLKhBlEiyTg5fY')" role="presentation" aria-hidden="true"></div>
      </div>

    </div>

    <!-- Text content -->
    <div class="space-y-6 max-w-2xl mx-auto">
      <h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-primary">
        404 — Campo non trovato
      </h1>
      <p class="font-body-lg text-body-lg text-on-surface-variant leading-relaxed">
        Sembra che la pagina che stai cercando sia stata spostata o non esista più.<br class="hidden md:block"/>
        Forse è stata raccolta in anticipo?
      </p>
      <div class="flex flex-col md:flex-row items-center justify-center gap-6 mt-12">
        <a href="index.html" class="group flex items-center gap-3 bg-primary text-on-primary px-10 py-4 rounded-full font-body-md font-bold hover:shadow-lg active:scale-95 transition-all">
          <span class="material-symbols-outlined">home</span>
          Torna alla Home
        </a>
        <a href="contatti.html" class="group flex items-center gap-3 border border-primary text-primary px-10 py-4 rounded-full font-body-md font-bold hover:bg-primary/5 active:scale-95 transition-all">
          <span class="material-symbols-outlined">mail</span>
          Contattaci
        </a>
      </div>
    </div>

  </div>
</main>

<div id="footer-placeholder"></div>

<script src="../js/main.js"></script>
<script>
  window.addEventListener('mousemove', (e) => {
    const card = document.getElementById('tilt-card');
    if (!card) return;
    const xAxis = (window.innerWidth  / 2 - e.pageX) / 50;
    const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
    card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
  });
</script>
</body>
</html>
